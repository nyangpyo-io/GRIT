name: Morning Alarm Scheduler
on:
  schedule:
    # 평일 10시 KST (01:00 UTC)
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
jobs:
  run-alarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install slack_sdk google-genai python-dotenv pytz
      - name: Check KST time
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ='Asia/Seoul' date +%H)
          echo "현재 KST 시간: $HOUR"
          if [ "$HOUR" -ge 12 ] || [ "$HOUR" -lt 10 ]; then
            echo "10시~11시 범위 아님, 종료"
            exit 0
          fi
      - name: Run Morning Alarm Script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python morning.py
