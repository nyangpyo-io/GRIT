name: Run Evening Alarm Script
on:
  schedule:
    # 평일 21시 KST (12:00 UTC)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  run-alarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install slack_sdk google-genai python-dotenv pytz slack_bolt
      - name: Check KST time
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ='Asia/Seoul' date +%H)
          echo "현재 KST 시간: $HOUR"
          if [ "$HOUR" -ge 24 ] || [ "$HOUR" -lt 21 ]; then
            echo "자정 넘었거나 21시 이전, 종료"
            exit 0
          fi
      - name: Run Evening Alarm Script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
         python evening.py
